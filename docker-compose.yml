services:
  mysql:
    image: mysql:8.0
    environment:
      # 必須。未設定だと MySQL が空パスワードで初期化されたり、DB 名が空のまま
      # 起動して原因の分かりにくい失敗になるため、compose の段階で止める。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env.example を参照して設定してください}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?.env.example を参照して設定してください}
    ports:
      # ホスト側は MYSQL_PORT（既定 3306）で公開する。コンテナ内は常に 3306。
      # ホストで別の MySQL が 3306 を使っている場合は MYSQL_PORT を変更する。
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    ports:
      # ホスト公開ポートとコンテナ内の listen ポートを API_PORT で揃える。
      # config.go も同じ API_PORT を読むため、この1変数だけで両側が動く。
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    volumes:
      - ./api:/app
      - go_cache:/root/go/pkg/mod
    environment:
      # API サーバーが listen するポート。config.go が読む。
      API_PORT: ${API_PORT:-8080}
      # DB 接続先は compose ネットワーク内の mysql サービス。ポートはコンテナ内の 3306
      # （ホスト公開用の MYSQL_PORT とは別物）。いずれも個別に上書きできる。
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      # 既定は mysql サービスの認証情報を流用する。別ユーザーを使う場合のみ上書きする。
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE}}
      # 必須。空の署名鍵での起動を防ぐ（config.Load も未設定ならエラーにするが、
      # コンテナを起動する前に落とした方が原因が分かりやすい）。
      JWT_SECRET: ${JWT_SECRET:?.env.example を参照して設定してください。openssl rand -base64 48 で生成できます}
      # パスワード設定リンクの生成元。既定はフロントの公開ホスト/ポートから組み立てる。
      APP_BASE_URL: ${APP_BASE_URL:-http://${APP_HOST:-localhost}:${PMO_DASHBOARD_PORT:-3000}}
      # ローカルはHTTPのためSecure Cookieを無効化する。本番（HTTPS）では設定しない（既定true）
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy

  pmo-dashboard:
    build:
      context: ./apps/pmo-dashboard
      target: dev
    ports:
      # ホスト側は PMO_DASHBOARD_PORT（既定 3000）で公開する。コンテナ内は常に 3000。
      - "${PMO_DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./apps/pmo-dashboard:/app
      - /app/node_modules
    environment:
      # ブラウザ（クライアント）はホスト経由で API を叩くため、公開ホスト/ポートから組み立てる。
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://${APP_HOST:-localhost}:${API_PORT:-8080}}
      # SSR（コンテナ内）は compose ネットワーク経由で api を直接引く。
      # api の listen ポートは API_PORT なので、ホスト名だけ api に差し替えて組み立てる。
      NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER:-http://api:${API_PORT:-8080}}
      HOST: 0.0.0.0
    depends_on:
      - api

  # Backlog連携・レポート自動生成のワークフロー実行基盤。
  # ワークフローは mySql ノードで DB に直接接続するため mysql の起動完了を待つ。
  n8n:
    # air と同じ理由でバージョンを固定する。:latest だと上流のリリースだけで
    # 壊れる上、n8n はメジャー更新時に n8n_data 内のDBを不可逆に移行するため。
    image: n8nio/n8n:2.17.6
    ports:
      # ホスト公開ポートとコンテナ内の listen ポートを N8N_PORT で揃える。
      - "${N8N_PORT:-5678}:${N8N_PORT:-5678}"
    environment:
      # n8n が listen するポート。5679 は n8n 内部の Task Broker が使うため、
      # ここに 5679 を指定すると衝突して起動に失敗する。
      N8N_PORT: ${N8N_PORT:-5678}
      # スケジュールトリガの発火時刻が UTC 基準になるのを防ぐため明示する。
      TZ: ${TZ:-Asia/Tokyo}
      GENERIC_TIMEZONE: ${TZ:-Asia/Tokyo}
      N8N_DEFAULT_LOCALE: ${N8N_DEFAULT_LOCALE:-ja}
    volumes:
      # 認証情報・ワークフロー・暗号鍵の実体。消すと n8n 上の設定が全て失われる。
      - n8n_data:/home/node/.n8n
      # リポジトリ管理のワークフロー JSON をインポート元として見せる。
      - ./n8n/workflows:/home/node/workflows
    depends_on:
      mysql:
        condition: service_healthy

  # マイグレーション専用（golang-migrate）。`make migrate-up` 等から `docker compose run` で起動する。
  migrate:
    image: migrate/migrate
    profiles: [tools]
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      mysql:
        condition: service_healthy

  # --- 以下は未実装のため無効化（スキャフォールド後に有効化する）---
  # worktrack: apps/worktrack 未構築（package.json なし）
  # storybook-pmo / storybook-worktrack: storybook スクリプト未整備

volumes:
  mysql_data:
  go_cache:
  n8n_data:
